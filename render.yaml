# Render Blueprint for the SmartSpend backend (Flask + OCR/voice services).
# This file lets Render auto-configure the service when you connect this
# GitHub repo — see the deployment instructions given alongside this file
# for the manual steps that still need doing on Render's dashboard
# (creating the account, connecting the repo, and filling in the actual
# secret values below, which are deliberately NOT stored in this file since
# it's committed to git).
#
# rootDir tells Render this Python service lives in the backend/ subfolder,
# not the repo root (the repo root is the Flutter app).
services:
  - type: web
    name: smartspend-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Fill in the actual values on Render's dashboard (Environment tab) —
      # never commit real secrets into this file.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHISPER_MODEL_SIZE
        # History: 'medium' locally -> 'base' on Render (512MB free-tier RAM
        # cap) -> 'tiny' after a MULTI-SENTENCE recording timed out on the
        # free tier's shared CPU. 'tiny', though, mishears spoken numbers
        # badly ("thirty ringgit each" -> "Turing Gat Each"), especially
        # when a quantity is spoken first -- the exact case the app needs.
        #
        # Now 'small': ~250MB int8. Closer to the 512MB cap than 'base' but
        # still fits alongside Flask, and it is markedly more accurate on
        # Mandarin (the demo is Chinese-heavy) as well as on number words and
        # proper nouns. Only the SINGLE short phrases voice entry actually
        # uses -- the historical timeout was a cold-start + model-load +
        # long-audio pile-up, so warm the instance with one throwaway
        # recording before relying on it. Drop to 'base' (then 'tiny') here
        # if it OOMs or first-call latency is a problem.
        value: small
